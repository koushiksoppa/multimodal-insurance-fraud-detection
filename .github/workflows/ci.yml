name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the hosted runner from downloading CUDA wheels; this project is CPU-only.
  PIP_EXTRA_INDEX_URL: ""

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-torch-cpu.txt

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        # Network-dependent tests are skipped in CI: the datasets are large and
        # hosted externally, so pulling them on every push would be slow and
        # would make the build depend on a third party staying online.
        run: pytest -m "not network" --cov=src --cov=app --cov-report=term-missing

      - name: Import smoke check
        run: python -c "import src; print('package version', src.__version__)"
